name: Report a listed extension
description: A listed extension is malicious, misrepresents what it does, or is unsafe to keep listed.
labels: ["listing-report"]
body:
  - type: markdown
    attributes:
      value: |
        For ordinary bugs, please use the extension's own issue tracker. This form is for
        problems with the LISTING — the entry should be changed or yanked.
  - type: input
    id: extension
    attributes:
      label: Package name
      placeholder: "@acme/penguin-extension-widgets"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong with the listing
      description: Be specific about what the extension does versus what its entry claims.
    validations:
      required: true
  - type: checkboxes
    id: contacted
    attributes:
      label: Have you contacted the author?
      options:
        - label: I have raised this with the extension's maintainers, or explain below why I have not.
