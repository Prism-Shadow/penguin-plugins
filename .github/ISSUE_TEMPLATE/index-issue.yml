name: Problem with the index
description: The checks, the docs, the published index.json, or the submission process.
labels: ["index"]
body:
  - type: textarea
    id: description
    attributes:
      label: What went wrong
      description: If a check rejected a valid submission, paste the CI output.
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin involved
      description: The npm package name, if this is about a specific entry.
