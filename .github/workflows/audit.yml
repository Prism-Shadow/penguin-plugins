name: Audit

# The per-PR checks only look at what changed. A listed package can rot afterwards:
# unpublished, deprecated, or republished with different metadata. This sweep re-checks
# every entry so the catalogue does not quietly point at something that no longer
# matches its manifest.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Re-check every listed extension
    runs-on: ubuntu-latest
    if: github.repository == 'Prism-Shadow/penguin-plugins'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-npm --all
